# 真实 GitHub 权限与缓存检查。首个 PR 没有 main 缓存时明确记录 pending，
# 合并后的 main push 建立基线，后续 PR 必须检查恢复后的实际回归结果。
name: action-integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  baseline-cache:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed the default branch baseline cache
        id: baseline
        uses: ./
        with:
          mode: baseline
          cache: "true"
          config: examples/fincare-agent/specagent.baseline.yaml
          artifact-name: integration-main-baseline
      - name: Check the baseline exit code
        env:
          SA_GATE_EXIT: ${{ steps.baseline.outputs.gate-exit-code }}
        run: |
          python -c 'import os; assert os.environ["SA_GATE_EXIT"] == "0"'

  cache-consumer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the main baseline after the workflow reaches the base branch
        env:
          SA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${SA_BASE_SHA}:.github/workflows/action-integration.yml" 2>/dev/null; then
            echo "SA_REQUIRE_CACHE=true" >> "$GITHUB_ENV"
          else
            echo "SA_REQUIRE_CACHE=false" >> "$GITHUB_ENV"
          fi
      - name: Candidate against a cache from an earlier run
        id: candidate
        uses: ./
        continue-on-error: true
        with:
          mode: candidate
          cache: "true"
          config: examples/fincare-agent/specagent.yaml
          artifact-name: integration-cache-candidate
      - name: Check cache evidence and the actual gate result
        env:
          SA_GATE_EXIT: ${{ steps.candidate.outputs.gate-exit-code }}
          SA_CACHE_KEY: ${{ steps.candidate.outputs.cache-matched-key }}
          SA_ACTION_OUTCOME: ${{ steps.candidate.outcome }}
        run: python scripts/check_action_integration.py cache --out cache-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-cache-evidence
          path: cache-evidence.json
          if-no-files-found: error

  readonly-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 此 token 实际没有评论写权限。不是模拟客户端，也不运行不受信代码的特权任务。
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Baseline without shared cache
        uses: ./
        with:
          mode: baseline
          cache: "false"
          config: examples/fincare-agent/specagent.baseline.yaml
          artifact-name: integration-readonly-baseline
      - name: Candidate with a read-only comment token
        id: candidate
        uses: ./
        continue-on-error: true
        with:
          mode: candidate
          cache: "false"
          comment: "true"
          config: examples/fincare-agent/specagent.yaml
          artifact-name: integration-readonly-candidate
      - name: Check comment fallback did not replace the gate result
        env:
          SA_GATE_EXIT: ${{ steps.candidate.outputs.gate-exit-code }}
          SA_COMMENT_STATUS: ${{ steps.candidate.outputs.comment-status }}
          SA_ACTION_OUTCOME: ${{ steps.candidate.outcome }}
        run: python scripts/check_action_integration.py readonly --out readonly-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-readonly-evidence
          path: readonly-evidence.json
          if-no-files-found: error
