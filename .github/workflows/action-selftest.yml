# 可复用 Action 的自测(v1 design §9.1):用显式 mode 跑 FinCare 的
# baseline(补丁版,必须通过)与 candidate(缺陷版,gate 必须拦截)。
# 显式 mode 让自测不依赖触发事件类型。
name: action-selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        status: [ERROR, FLAKY]
        mode: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create a low-severity offline quality fixture
        run: python tests/fixtures/create_quality_project.py --root .quality-selftest --status ${{ matrix.status }}
      - name: Quality failures must block, including baseline mode
        id: quality
        uses: ./
        continue-on-error: true
        with:
          mode: ${{ matrix.mode }}
          cache: "false"
          config: .quality-selftest/specagent.yaml
          artifact-name: quality-${{ matrix.status }}-${{ matrix.mode }}
      - name: Verify gate output, report and absence of an unsafe baseline
        env:
          SA_OUTCOME: ${{ steps.quality.outcome }}
          SA_CODE: ${{ steps.quality.outputs.gate-exit-code }}
          SA_STATUS: ${{ matrix.status }}
        run: |
          test "$SA_OUTCOME" = failure
          test "$SA_CODE" = 1
          test -s specagent-report.html
          test -s specagent-report.xml
          python - <<'PY'
          import json, os
          from app.storage import Store
          payload = json.load(open('result.json'))
          assert payload['gate']['exit_code'] == 1
          assert {entry['candidate_status'] for entry in payload['gate']['violations']} == {os.environ['SA_STATUS']}
          assert Store('.specagent-ci/specagent.db').get_baseline(payload['run']['project_id']) is None
          PY

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baseline (patched agent) — must pass
        uses: ./
        with:
          mode: baseline
          cache: "false"
          config: examples/fincare-agent/specagent.baseline.yaml
          artifact-name: selftest-baseline

      - name: Candidate (vulnerable agent) — gate MUST fail
        id: blocked
        uses: ./
        continue-on-error: true
        with:
          mode: candidate
          cache: "false"
          config: examples/fincare-agent/specagent.yaml
          artifact-name: selftest-candidate

      - name: Assert the gate blocked the candidate
        if: steps.blocked.outcome != 'failure'
        run: |
          echo "::error::expected the candidate run to fail the gate, got '${{ steps.blocked.outcome }}'"
          exit 1
