# Self-check: prove the CI gate works by running the example regression story
# in a matrix — one job per example project. This is the exact loop users copy
# into their own agent repositories (see README → GitHub CI). The baseline
# (patched agent) must pass with exit 0; the candidate (vulnerable agent) must
# fail with exactly exit 1 — a config error (exit 2) does NOT count as a
# successful block (v1 design §6.3).
name: specagent-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [ecommerce-agent, fincare-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SpecAgent
        run: pip install -e .

      - name: Baseline (patched agent) — must pass
        run: |
          specagent run --config examples/${{ matrix.example }}/specagent.baseline.yaml \
            --set-baseline --db gate.db --label baseline

      - name: Candidate (vulnerable agent) — gate MUST fail with exit 1
        run: |
          set +e
          specagent run --config examples/${{ matrix.example }}/specagent.yaml \
            --db gate.db --label candidate --json > candidate.json
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1, got $code"
            exit 1
          fi
          echo "Gate correctly blocked the candidate run (exit 1)."

      - name: Export JUnit report
        run: |
          CANDIDATE=$(python -c "import json;print(json.load(open('candidate.json'))['run']['id'])")
          specagent export --run "$CANDIDATE" --format junit --db gate.db --out specagent-report.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specagent-junit-${{ matrix.example }}
          path: specagent-report.xml
