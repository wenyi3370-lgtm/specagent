name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit + integration tests
        run: pytest -v
        env:
          # keep tests deterministic: no LLM compiler, no external agent
          OPENAI_API_KEY: ""
          TARGET_AGENT_URL: ""
