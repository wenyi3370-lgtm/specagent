name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build backend and runtime dependencies
        run: pip install setuptools ".[dev]"
      - name: Check installed wheel and upgrade from v0.10
        run: python scripts/check_release_package.py --previous-ref v0.10
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-python-${{ matrix.python }}
          path: dist/
          if-no-files-found: error

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SpecAgent (editable, with dev extras)
        run: pip install -e ".[dev]"
      - name: Run unit + integration tests
        run: python -m pytest -v
        env:
          # keep tests deterministic: no LLM compiler, no external agent
          OPENAI_API_KEY: ""
          TARGET_AGENT_URL: ""

  # The browser test is a separate job on purpose: it needs Node, a browser
  # download, and a real Chrome, none of which the API-only job should pay for.
  # tests/browser/test_dashboard_browser.js reuses a playwright-core found on the
  # machine and skips when there is none, so without this job the suite would
  # silently stop covering the dashboard the moment the job count changes.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install SpecAgent (editable, with dev extras)
        run: pip install -e ".[dev]"
      - name: Install playwright and verify an available browser
        timeout-minutes: 10
        # The harness already prefers channel:chrome. Hosted Ubuntu images
        # include Chrome; verify launch before relying on it. Otherwise install
        # the Chromium revision matching this full playwright package.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
        run: |
          npm install --no-save --no-audit --no-fund playwright
          if node -e 'const {chromium}=require("playwright"); (async()=>{const browser=await chromium.launch({channel:"chrome",headless:true}); console.log("Verified system Chrome " + browser.version()); await browser.close();})().catch(error=>{console.error(error.message); process.exit(1);});'; then
            echo "Using launch-verified Chrome for the existing browser tests"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Drive the dashboard in a real browser
        run: python -m pytest tests/test_browser_ui.py tests/test_preferences_ui.py tests/test_accounts_ui.py tests/test_notifications_ui.py tests/test_connect_guide_ui.py -v
        env:
          OPENAI_API_KEY: ""
          TARGET_AGENT_URL: ""
